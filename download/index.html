<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download | Slimee Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="page-download">
  <div class="site-shell">
    <header class="site-header">
      <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="../home/" aria-label="Slimee Store home">
          <img class="brand-logo" src="../assets/img/logo.png" width="44" height="44" alt="" decoding="async" />
          <span>
            <strong>Slimee Store</strong>
            <small>FiveM Packages</small>
          </span>
        </a>
      </nav>
    </header>

    <main class="download-main">
      <section class="download-panel glass-card">
        <p class="eyebrow">Secure download</p>
        <h1>Download your package</h1>
        <p class="download-lead">Enter the license key from your purchase email or success page.</p>

        <form id="download-form" class="download-form">
          <label class="download-field">
            <span>License key</span>
            <input type="text" name="licenseKey" id="license-key-input" autocomplete="off" placeholder="SLIMEE-XXXX-XXXX-XXXX" required />
          </label>
          <label class="download-field">
            <span>Package ID</span>
            <input type="text" name="packageId" id="package-id-input" autocomplete="off" placeholder="advanced-job-system" required />
          </label>
          <button type="submit" class="button button-primary">Get download link</button>
        </form>

        <p id="download-status" class="download-status" role="status" aria-live="polite"></p>
        <p id="download-hint" class="download-hint" hidden>
          <button type="button" id="download-file-btn" class="button button-primary">Download ZIP</button>
        </p>
      </section>
    </main>
  </div>

  <script>window.STORE_REPO_PREFIX = "..";</script>
  <script src="../assets/js/paths.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/catalog.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const licenseInput = document.getElementById("license-key-input");
      const packageInput = document.getElementById("package-id-input");
      const form = document.getElementById("download-form");
      const statusEl = document.getElementById("download-status");
      const hintEl = document.getElementById("download-hint");
      const fileBtn = document.getElementById("download-file-btn");
      const base = (window.STORE_CONFIG?.apiBaseUrl || "").replace(/\/$/, "");
      let activeDownloadUrl = "";
      let activeStatusUrl = "";
      let activeToken = "";
      let activePackageId = "";

      function buildDownloadUrlsFromToken(token) {
        const safe = String(token || "").trim().toLowerCase();
        return {
          file: `${base}/api/downloads/file/${safe}`,
          status: `${base}/api/downloads/file/${safe}/status`
        };
      }

      function formatDownloadError(data, status) {
        if (data?.error) return data.error;
        if (status === 410) return "This download link has expired. Request a new link below.";
        if (status === 404) return "The package file is not available yet. Contact support.";
        if (status === 503) return "Storage is temporarily unavailable. Try again in a few minutes.";
        return "Download failed. Try again or request a new link.";
      }

      function extractToken(downloadUrl) {
        const match = String(downloadUrl || "").match(/\/file\/([a-f0-9]+)(?:\/|$)/i);
        return match ? match[1] : "";
      }

      function isCrossOrigin(url) {
        try {
          return new URL(url).origin !== window.location.origin;
        } catch {
          return true;
        }
      }

      if (params.get("licenseKey")) licenseInput.value = params.get("licenseKey");
      if (params.get("packageId")) packageInput.value = params.get("packageId");

      if (typeof window.ensureCatalogLoaded === "function") {
        await window.ensureCatalogLoaded();
      }
      const packages = window.PACKAGES_CATALOG || [];
      if (packages.length && !packageInput.value) {
        packageInput.placeholder = packages[0].id;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hintEl.hidden = true;
        statusEl.textContent = "";

        if (!base) {
          statusEl.textContent = "Set apiBaseUrl in assets/js/config.js first.";
          return;
        }

        const licenseKey = licenseInput.value.trim();
        const packageId = packageInput.value.trim();

        statusEl.textContent = "Validating license…";

        try {
          const res = await fetch(`${base}/api/downloads/request`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ licenseKey, packageId })
          });
          const data = await res.json();

          if (!res.ok) {
            statusEl.textContent = data.error || "Download not available.";
            return;
          }

          statusEl.textContent = "License valid. Your download link is ready (expires in 10 minutes).";
          activeToken = String(data.token || extractToken(data.downloadUrl) || "").trim().toLowerCase();
          const urls = buildDownloadUrlsFromToken(activeToken);
          activeDownloadUrl = urls.file;
          activeStatusUrl = urls.status;
          activePackageId = packageId;
          if (data.downloadUrl && data.downloadUrl !== activeDownloadUrl) {
            console.warn("[download] API downloadUrl host differs from apiBaseUrl — using apiBaseUrl + token", {
              apiDownloadUrl: data.downloadUrl,
              used: activeDownloadUrl,
              token: activeToken
            });
          }
          fileBtn.textContent = `Download ${packageId}.zip`;
          hintEl.hidden = false;
        } catch {
          statusEl.textContent = "Could not reach the download API.";
        }
      });

      fileBtn.addEventListener("click", async () => {
        if (!activeDownloadUrl) return;
        fileBtn.disabled = true;
        const prevLabel = fileBtn.textContent;
        fileBtn.textContent = "Preparing download…";
        statusEl.textContent = "Checking download…";

        try {
          const urls = activeToken
            ? buildDownloadUrlsFromToken(activeToken)
            : { file: activeDownloadUrl, status: activeStatusUrl };
          const statusUrl = urls.status;
          activeDownloadUrl = urls.file;

          const statusRes = await fetch(statusUrl, { method: "GET" });
          const statusData = await statusRes.json().catch(() => ({}));

          if (!statusRes.ok || !statusData.ok) {
            const detail = statusData.tokenFound === false ? " (token not in database)" : "";
            statusEl.textContent = formatDownloadError(statusData, statusRes.status) + detail;
            console.warn("[download] status check failed", { statusUrl, statusData, activeToken });
            return;
          }

          if (statusData.delivery === "redirect" && statusData.redirectUrl) {
            statusEl.textContent = "Redirecting to secure download…";
            window.location.href = statusData.redirectUrl;
            return;
          }

          statusEl.textContent = "Building your protected package… This may take a minute.";
          console.info("[download] starting file GET", { activeDownloadUrl, activeToken });

          if (isCrossOrigin(activeDownloadUrl)) {
            window.location.href = activeDownloadUrl;
            statusEl.textContent =
              "Download started in your browser. If nothing saves, wait a moment and try again.";
            return;
          }

          const res = await fetch(activeDownloadUrl, { method: "GET" });
          const contentType = res.headers.get("content-type") || "";

          if (res.redirected && res.url) {
            window.location.href = res.url;
            return;
          }

          if (!res.ok) {
            const data = contentType.includes("application/json")
              ? await res.json().catch(() => ({}))
              : {};
            statusEl.textContent = formatDownloadError(data, res.status);
            return;
          }

          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${activePackageId || "package"}-protected.zip`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          statusEl.textContent = "Download started. Check your downloads folder.";
        } catch (err) {
          statusEl.textContent = `Download error: ${err.message || "Network error"}. Trying direct download…`;
          window.location.href = activeDownloadUrl;
        } finally {
          fileBtn.disabled = false;
          fileBtn.textContent = prevLabel;
        }
      });
    })();
  </script>
</body>
</html>
